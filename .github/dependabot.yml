# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Ruby Bundler (Gemfile/Gemfile.lock) for this Jekyll site
  - package-ecosystem: bundler
    directory: "/" # Location of Gemfile
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - dependencies
      - ruby
    open-pull-requests-limit: 10
    rebase-strategy: auto
    commit-message:
      prefix: "deps"
      include: scope

  # GitHub Actions workflow updates (if/when workflows are added)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - dependencies
      - github-actions
    rebase-strategy: auto
    commit-message:
      prefix: "deps"
      include: scope

# Note: Security updates are controlled in the repository settings (Dependabot alerts & security updates).
# This config enables routine version updates; when security updates are enabled, GitHub will also
# open security PRs with a "security" label when a vulnerability impacts this repo.
