name: Auto-merge Dependabot PRs

on:
  pull_request:
    types: [opened, labeled, ready_for_review, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge for Dependabot security PRs
    runs-on: ubuntu-latest
    # Only when the PR is opened by Dependabot and marked as security
    if: >-
      github.actor == 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'security')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure PR is from Dependabot
        id: check
        run: |
          echo "actor=${{ github.actor }}" >> $GITHUB_OUTPUT

      - name: Enable auto-merge when criteria met
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          # Set the merge method; squash is typical for Dependabot
          MERGE_METHOD=squash
          # Try to enable auto-merge; if already enabled, ignore error
          gh pr merge --auto --$MERGE_METHOD "$PR_NUMBER" || true
