name: Build and Deploy Jekyll with Custom Plugins

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow manual triggering
  workflow_dispatch:
  # Run daily at 9am US Eastern Time (1pm UTC) to publish scheduled posts.
  # Cron is UTC-only, so this is 9am EDT in summer and 8am EST in winter.
  # Run weekly on Sunday to update language data
  schedule:
    - cron: '0 13 * * *'  # Daily at 9am EDT / 8am EST
    - cron: '0 0 * * 0'  # Weekly on Sunday

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency strategy: PRs run concurrently (each in their own group), main branch deploys sequentially
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.9'
          bundler-cache: false  # Disable cache since we changed dependencies
          
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
        
      - name: Install dependencies
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3
        
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Purge Cloudflare cache
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | tee /tmp/cf_purge_response.json
          if ! grep -q '"success":true' /tmp/cf_purge_response.json; then
            echo "Cloudflare cache purge failed:"
            cat /tmp/cf_purge_response.json
            exit 1
          fi
          echo "Cloudflare cache purged successfully"