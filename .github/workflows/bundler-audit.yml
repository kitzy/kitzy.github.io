name: Bundler Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  bundler-audit:
    name: Scan Ruby dependencies (bundler-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Ensure bundler-audit installed
        run: |
          bundle show bundler-audit >/dev/null 2>&1 || bundle add bundler-audit --group development
      
      - name: Update advisory database
        run: |
          bundle exec bundler-audit update

      - name: Audit Gemfile.lock for vulnerabilities
        run: |
          bundle exec bundler-audit check --ignore CVE-2015-9284
