name: Bundler Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  bundler-audit:
    name: Scan Ruby dependencies (bundler-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install bundler-audit
        run: |
          gem install bundler-audit
      
      - name: Update advisory database
        run: |
          bundler-audit update

      - name: Audit Gemfile.lock for vulnerabilities
        run: |
          bundler-audit check --ignore CVE-2015-9284
