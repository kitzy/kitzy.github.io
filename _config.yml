# Site settings
title: "Kitzy"
description: "Always automating, always iterating, always helping others."
baseurl: ""
url: "https://kitzy.com"
author: "Kitzy"
timezone: America/New_York

# GitHub settings
github_username: kitzy
repository: kitzy/kitzy.com

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-sitemap
  - jekyll-feed

# GitHub Pages specific settings (for Actions deployment)
# github: [metadata]  # Commented out for custom Actions deployment

# Permalink settings
permalink: /:categories/:title/

# Blog settings
blog_path: blog

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:title/
  pages:
    output: true
    permalink: /:name/
  redirects:
    output: true

# Collections paths - all content is in the content/ directory
collections_dir: content

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata

# Include static content assets (Jekyll copies these to _site)
include:
  - content/assets

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Kitzy"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "redirects"
    values:
      layout: "redirect"

# Social media defaults
social:
  image: "https://github.com/kitzy.png"
  type: "website"

# Site navigation
navigation:
  - title: "Blog"
    url: "/"
  - title: "Projects"
    url: "/projects/"
  - title: "Podcasts"
    url: "/podcasts/"
  - title: "README"
    url: "/readme/"