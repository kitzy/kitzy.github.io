<!DOCTYPE html>
<html lang="en">
<head>
    {% include head.html %}
</head>
<body>
    <div class="container">
        {% include sidebar.html %}

        <main class="main-content">
            <nav class="tab-navigation">
                {% for nav_item in site.navigation %}
                    {% assign is_active = false %}
                    {% if page.url == nav_item.url %}
                        {% assign is_active = true %}
                    {% endif %}
                    
                    <a href="{{ nav_item.url | relative_url }}" 
                       class="tab-button{% if is_active %} active{% endif %}"
                       data-tab="{{ nav_item.title | downcase }}">
                        {{ nav_item.title }}
                    </a>
                {% endfor %}
            </nav>

            {% include breadcrumbs.html %}

            <div class="tab-content">
                <div class="tab-pane active markdown-content">
                    {{ content }}
                </div>
            </div>
        </main>
    </div>

    <button class="mobile-menu-toggle" id="mobile-menu-toggle">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/blog-pagination.js' | relative_url }}"></script>
</body>
</html>
