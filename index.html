<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kitzy - Customer Support Engineer at Fleet, Infrastructure Nerd, Dog & Motorcycle Lover. Over 15 years in endpoint management & IT engineering.">
    <meta name="keywords" content="infrastructure, automation, IT engineering, endpoint management, Fleet, DevOps">
    <meta name="author" content="Kitzy">
    <meta property="og:title" content="Kitzy - Developer Profile">
    <meta property="og:description" content="Customer Support Engineer at Fleet, Infrastructure Nerd, Dog & Motorcycle Lover">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kitzy.github.io">
    <title>Kitzy - Developer Profile</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="profile-section">
                <div class="avatar-container">
                    <img id="avatar" class="avatar" src="" alt="Profile Avatar">
                </div>
                <h1 id="name" class="name">Loading...</h1>
                <p id="username" class="username">@kitzy</p>
                <p id="bio" class="bio">Loading...</p>
                
                <div class="stats">
                    <div class="stat">
                        <span id="followers" class="stat-number">0</span>
                        <span class="stat-label">followers</span>
                    </div>
                    <span class="stat-separator">•</span>
                    <div class="stat">
                        <span id="following" class="stat-number">0</span>
                        <span class="stat-label">following</span>
                    </div>
                </div>

                <div class="profile-details">
                    <div id="company" class="detail-item">
                        <span class="detail-icon">🏢</span>
                        <span class="detail-text"></span>
                    </div>
                    <div id="location" class="detail-item">
                        <span class="detail-icon">📍</span>
                        <span class="detail-text"></span>
                    </div>
                    <div id="email" class="detail-item">
                        <span class="detail-icon">✉️</span>
                        <span class="detail-text"></span>
                    </div>
                    <div id="website" class="detail-item">
                        <span class="detail-icon">🔗</span>
                        <a class="detail-link" href="#" target="_blank"></a>
                    </div>
                    <div id="twitter" class="detail-item">
                        <span class="detail-icon">🐦</span>
                        <a class="detail-link" href="#" target="_blank"></a>
                    </div>
                </div>
            </div>

            <!-- GitHub Contributions Grid -->
            <div class="contributions-section">
                <h3 class="contributions-title">GitHub Contributions</h3>
                <div id="contributions-grid" class="contributions-grid">
                    Loading contributions...
                </div>
                <div class="contributions-legend">
                    <span class="legend-text">Less</span>
                    <div class="legend-colors">
                        <div class="legend-color level-0"></div>
                        <div class="legend-color level-1"></div>
                        <div class="legend-color level-2"></div>
                        <div class="legend-color level-3"></div>
                        <div class="legend-color level-4"></div>
                    </div>
                    <span class="legend-text">More</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <nav class="tab-navigation">
                <button class="tab-button active" data-tab="readme">README</button>
                <button class="tab-button" data-tab="usermanual">User Manual</button>
                <button class="tab-button" data-tab="projects">Projects</button>
                <button class="tab-button" data-tab="blog">Blog</button>
            </nav>

            <div class="tab-content">
                <div id="readme-content" class="tab-pane active">
                    <div class="loading">Loading README...</div>
                </div>
                <div id="usermanual-content" class="tab-pane">
                    <div class="loading">Loading User Manual...</div>
                </div>
                <div id="projects-content" class="tab-pane">
                    <div class="loading">Loading Projects...</div>
                </div>
                <div id="blog-content" class="tab-pane">
                    <div class="loading">Loading Blog...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile menu toggle -->
    <button class="mobile-menu-toggle" id="mobile-menu-toggle">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
